[project]
name = "bsi-pipeline"
version = "0.1.0"
description = "BSI IT-Grundschutz SYS data pipeline (download -> PDFs -> requirements -> sentences -> metrics)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11.9",
]

[project.scripts]
bsi-pipeline = "bsi_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsi_pipeline"]
